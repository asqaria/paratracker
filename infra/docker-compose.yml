# Локальное окружение: PostgreSQL 17 + PostGIS 3.5 и MinIO (S3).
# Запуск из корня: docker compose --env-file .env -f infra/docker-compose.yml up -d --wait
# Значения по умолчанию — только для локальной разработки и CI.

name: skyline

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skyline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skyline}
      POSTGRES_DB: ${POSTGRES_DB:-skyline}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # Официальный реестр MinIO; на Docker Hub образ больше не публикуется.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-skyline}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-skyline-dev-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Одноразово создаёт бакет: /health проверяет именно его, а не только доступность MinIO.
  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-skyline}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-skyline-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-skyline}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing "local/$$S3_BUCKET"
    restart: "no"

volumes:
  pgdata:
  miniodata:
