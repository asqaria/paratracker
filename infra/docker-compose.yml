# Локальное окружение: PostgreSQL 17 + PostGIS 3.5 и MinIO (S3).
# Запуск из корня: docker compose --env-file .env -f infra/docker-compose.yml up -d --wait
# Значения по умолчанию — только для локальной разработки и CI.

name: skyline

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skyline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skyline}
      POSTGRES_DB: ${POSTGRES_DB:-skyline}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # MinIO закрыл анонимную загрузку образов и на quay.io, и на Docker Hub
    # (401 с сентября 2026) — CI и любая новая машина не могли поднять окружение.
    # Chainguard собирает тот же сервер из исходников и раздаёт бесплатно, но
    # только тег latest: версию закрепить нельзя. Для локального S3 и тестов
    # это приемлемо — API стабилен; в проде хранилище — R2 (ТЗ §4.2).
    # Образ без shell; mc внутри есть — healthcheck прежний.
    image: cgr.dev/chainguard/minio:latest
    # По умолчанию образ работает от uid 65532, а старый MinIO писал том от root:
    # на существующем miniodata сервер падал с «file access denied». От root он
    # читает прежние данные — проверено на томе, записанном старым образом.
    # Только локальная разработка и CI; в проде хранилище — R2.
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-skyline}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-skyline-dev-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Одноразово создаёт бакет: /health проверяет именно его, а не только доступность MinIO.
  minio-init:
    # Без shell: mc берёт адрес и ключи из MC_HOST_<alias>, имя бакета
    # подставляет сам compose.
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-skyline}:${MINIO_ROOT_PASSWORD:-skyline-dev-secret}@minio:9000
    command: ["mb", "--ignore-existing", "local/${S3_BUCKET:-skyline}"]
    restart: "no"

volumes:
  pgdata:
  miniodata:
